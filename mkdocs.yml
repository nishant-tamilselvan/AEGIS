# Documentation site, built from docs/ and published to GitHub Pages by
# .github/workflows/pages.yml. Build locally with:
#   pip install -r docs/requirements.txt && mkdocs serve
site_name: AEGIS
site_description: >-
  Agents for GitHub Copilot and Claude Code that turn an idea into validated
  requirements, an implementable architecture and reviewed code.
site_url: https://nishant-tamilselvan.github.io/AEGIS/
repo_url: https://github.com/nishant-tamilselvan/AEGIS
repo_name: nishant-tamilselvan/AEGIS
edit_uri: edit/main/docs/
copyright: MIT licensed · If AEGIS is useful to you, please star it on GitHub.

docs_dir: docs
exclude_docs: |
  package-readme.md
  requirements.txt

hooks:
  - scripts/docs_hooks.py

theme:
  name: material
  icon:
    logo: material/shield-half-full
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow

nav:
  - Home: README.md
  - Get started:
      - Getting started: getting-started.md
      - How it works: how-it-works.md
  - Claude Code:
      - Using AEGIS with Claude Code: claude-code.md
      - AEGIS as a Claude Code plugin: claude-code-plugin.md
  - Reference:
      - Agents, prompts and skills: agents.md
      - CLI reference: cli-reference.md
      - Applications index: artifacts/README.md
  - Enterprise Standards setup: enterprise-standards-setup.md
  - Troubleshooting: troubleshooting.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/nishant-tamilselvan/AEGIS
      name: AEGIS on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/aegis-sdlc/
      name: aegis-sdlc on PyPI
