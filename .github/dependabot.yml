version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "pip"
    directories:
      - "/"
      - "/examples/enterprise-standards-server"
      - "/docs"
    schedule:
      interval: "weekly"
      day: "monday"
    versioning-strategy: "increase-if-necessary"
    ignore:
      # MkDocs 2 removes the plugin and theme systems the docs site depends on, with no
      # migration path. Stay on 1.x until the Material theme supports a successor.
      - dependency-name: "mkdocs"
        update-types: ["version-update:semver-major"]
    labels: ["dependencies", "python"]
    commit-message:
      prefix: "build"
    groups:
      python-security:
        applies-to: security-updates
        patterns: ["*"]
      python-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
