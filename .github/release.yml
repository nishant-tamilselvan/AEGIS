# Categories for GitHub's automatically generated release notes.
changelog:
  exclude:
    labels: ["skip-changelog"]
  categories:
    - title: Breaking changes
      labels: ["breaking-change"]
    - title: New features
      labels: ["enhancement", "feature"]
    - title: Bug fixes
      labels: ["bug", "fix"]
    - title: Security
      labels: ["security"]
    - title: Enterprise Standards
      labels: ["enterprise-standards"]
    - title: Documentation
      labels: ["documentation", "docs"]
    - title: Dependencies, tooling and CI
      labels: ["dependencies", "ci", "chore"]
    - title: Other changes
      labels: ["*"]
