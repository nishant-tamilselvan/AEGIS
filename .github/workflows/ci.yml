name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    # Every Python on Linux; the oldest and newest on Windows; the newest on macOS. macOS
    # minutes cost the most. The full 12-job matrix runs weekly (full-matrix.yml).
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: windows-latest, python: "3.10" }
          - { os: windows-latest, python: "3.13" }
          - { os: macos-latest, python: "3.13" }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

  lint:
    name: Lint and repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check --output-format=github .

      - name: Generated Copilot and Claude Code files are up to date
        run: python scripts/sync_platforms.py --check

      - name: Repository hygiene (personal paths, denylist, unicode, workflows, links)
        run: python scripts/ci/repo_checks.py all

      - name: Validate the sample Enterprise Standards knowledge base
        run: python examples/enterprise-standards-server/library.py --check examples/enterprise-standards-server/knowledge-base

      - name: Docs site builds with no broken links
        run: |
          python -m pip install -r docs/requirements.txt
          python -m mkdocs build --strict --site-dir "$RUNNER_TEMP/site"

      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: "**/*.md"

  package:
    name: Build package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install build==1.6.1
          python -m build

      - name: Install the wheel and use it outside the repository
        run: |
          python -m venv "$RUNNER_TEMP/pkg"
          "$RUNNER_TEMP/pkg/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP" && mkdir smoke && cd smoke
          tools="$RUNNER_TEMP/pkg/bin/artifact-tools"
          "$tools" scaffold product-requirements app --project Smoke
          "$tools" scaffold functional-requirements app --project Smoke
          "$tools" adr init app/architecture-decisions
          "$tools" adr new "Pick a database" app/architecture-decisions --status accepted
          "$tools" validate app

  plugin:
    name: Validate Claude Code plugin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Pinned to the version the plugin was validated with; its postinstall fetches the CLI.
      CLAUDE_CODE_VERSION: "2.1.263"
      DISABLE_AUTOUPDATER: "1"
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Claude Code
        run: npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      - name: Validate marketplace, plugin, skills and agents
        run: |
          claude plugin validate --strict .
          claude plugin validate --strict plugins/aegis
          claude plugin validate --strict plugins/aegis/skills
          claude plugin validate --strict plugins/aegis/agents

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (checksum verified)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks

      - name: Scan history for secrets
        run: ./gitleaks git --redact --verbose --exit-code 1 .
