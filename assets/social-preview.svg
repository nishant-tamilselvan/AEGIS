  </g>
  <text x="530" y="270" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="128" font-weight="700" letter-spacing="10" fill="#FFFFFF">AEGIS</text>
  <text x="534" y="332" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="32" fill="#AFC3F5">Agentic Enterprise Guided Intelligent System</text>
  <text x="534" y="398" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="27" fill="#E6ECFB">Idea → requirements → architecture → reviewed code</text>
