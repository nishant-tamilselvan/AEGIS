[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "aegis-sdlc"
version = "0.1.1"
description = "CLI for AEGIS: scaffold, validate and track requirements, architecture artifacts, ADRs and implementation work packages."
readme = "docs/package-readme.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nishant Tamilselvan" }]
keywords = ["ai-agents", "github-copilot", "claude-code", "sdlc", "architecture", "requirements", "adr", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.16",
    "pre-commit>=4.0",
]
diagrams = [
    "mermaidx>=0.8",
]

[project.urls]
Homepage = "https://github.com/nishant-tamilselvan/AEGIS"
Documentation = "https://nishant-tamilselvan.github.io/AEGIS/"
Issues = "https://github.com/nishant-tamilselvan/AEGIS/issues"
Changelog = "https://github.com/nishant-tamilselvan/AEGIS/blob/main/CHANGELOG.md"

[project.scripts]
artifact-tools = "artifact_tools.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/artifact_tools"]

# Bundle the templates so an installed CLI works outside this repository. A repository's
# own aegis/skills templates still take precedence (see find_templates_dir).
[tool.hatch.build.targets.wheel.force-include]
"aegis/skills/artifact-management/assets/templates" = "artifact_tools/templates/artifact"
"aegis/skills/implementation-management/assets/templates" = "artifact_tools/templates/implementation"

[tool.hatch.build.targets.sdist]
# Patterns are gitignore-style; a leading "/" anchors them to the repository root.
include = [
    "/src/artifact_tools",
    "/aegis/skills/artifact-management/assets/templates",
    "/aegis/skills/implementation-management/assets/templates",
    "/docs/package-readme.md",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [".venv", "docs/artifacts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# Long lines are tolerated in messages and tables; formatting is not enforced.
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["artifact_tools"]
known-local-folder = ["library"]
